<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="priceLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Candlestick motif (decorative) -->
  <g>
    <!-- wicks -->
    <line x1="708" y1="408" x2="708" y2="456" stroke="#34d399" stroke-width="2"/>
    <line x1="742" y1="396" x2="742" y2="432" stroke="#f87171" stroke-width="2"/>
    <line x1="776" y1="376" x2="776" y2="428" stroke="#34d399" stroke-width="2"/>
    <line x1="810" y1="404" x2="810" y2="434" stroke="#f87171" stroke-width="2"/>
    <line x1="844" y1="384" x2="844" y2="426" stroke="#34d399" stroke-width="2"/>
    <line x1="878" y1="358" x2="878" y2="408" stroke="#34d399" stroke-width="2"/>
    <line x1="912" y1="374" x2="912" y2="406" stroke="#f87171" stroke-width="2"/>
    <line x1="946" y1="336" x2="946" y2="386" stroke="#34d399" stroke-width="2"/>
    <line x1="980" y1="328" x2="980" y2="360" stroke="#f87171" stroke-width="2"/>
    <line x1="1014" y1="306" x2="1014" y2="350" stroke="#34d399" stroke-width="2"/>
    <line x1="1048" y1="320" x2="1048" y2="348" stroke="#f87171" stroke-width="2"/>
    <line x1="1082" y1="288" x2="1082" y2="330" stroke="#34d399" stroke-width="2"/>
    <!-- bodies -->
    <rect x="700" y="420" width="16" height="26" rx="2" fill="#34d399"/>
    <rect x="734" y="404" width="16" height="18" rx="2" fill="#f87171"/>
    <rect x="768" y="390" width="16" height="30" rx="2" fill="#34d399"/>
    <rect x="802" y="412" width="16" height="14" rx="2" fill="#f87171"/>
    <rect x="836" y="396" width="16" height="22" rx="2" fill="#34d399"/>
    <rect x="870" y="370" width="16" height="28" rx="2" fill="#34d399"/>
    <rect x="904" y="384" width="16" height="16" rx="2" fill="#f87171"/>
    <rect x="938" y="350" width="16" height="26" rx="2" fill="#34d399"/>
    <rect x="972" y="338" width="16" height="14" rx="2" fill="#f87171"/>
    <rect x="1006" y="318" width="16" height="24" rx="2" fill="#34d399"/>
    <rect x="1040" y="330" width="16" height="12" rx="2" fill="#f87171"/>
    <rect x="1074" y="300" width="16" height="22" rx="2" fill="#34d399"/>
  </g>

  <!-- Smoothed trend line through closes -->
  <path d="M708 432 C 745 412, 780 404, 820 398 S 900 372, 946 352 S 1020 320, 1082 306" fill="none" stroke="url(#priceLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Forecast band and dashed projection -->
  <path d="M1082 306 L1150 262 L1150 300 L1082 330 Z" fill="url(#band)"/>
  <path d="M1082 306 L1150 281" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1150" cy="281" r="4" fill="#38bdf8"/>

  <!-- Header -->
  <text x="60" y="110" font-family="'Geist Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#38bdf8">TIME SERIES · DEEP LEARNING · ENSEMBLE</text>
  <text x="60" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Stock Price</text>
  <text x="60" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Prediction</text>
  <text x="60" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#94a3b8">Five architectures and a weighted ensemble,</text>
  <text x="60" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#94a3b8">compared head to head on the same price history.</text>

  <!-- Tech tags -->
  <g font-family="'Geist Mono', Consolas, monospace" font-size="14">
    <rect x="60" y="610" width="88" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="104" y="630" text-anchor="middle" fill="#cbd5e1">BiLSTM</text>
    <rect x="158" y="610" width="64" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="190" y="630" text-anchor="middle" fill="#cbd5e1">GRU</text>
    <rect x="232" y="610" width="100" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="282" y="630" text-anchor="middle" fill="#cbd5e1">XGBoost</text>
    <rect x="342" y="610" width="134" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="409" y="630" text-anchor="middle" fill="#cbd5e1">Random Forest</text>
    <rect x="486" y="610" width="164" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="568" y="630" text-anchor="middle" fill="#cbd5e1">Linear Regression</text>
    <rect x="660" y="610" width="102" height="30" rx="15" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="711" y="630" text-anchor="middle" fill="#cbd5e1">Ensemble</text>
  </g>
</svg>
