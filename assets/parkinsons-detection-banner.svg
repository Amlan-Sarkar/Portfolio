<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b1d"/>
      <stop offset="1" stop-color="#030808"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2dd4bf" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- Header -->
  <text x="60" y="110" font-family="'Geist Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#2dd4bf">BIOMEDICAL ML · CLASSIFICATION</text>
  <text x="60" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#f0fdfa" letter-spacing="-1.5">Parkinson's</text>
  <text x="60" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#f0fdfa" letter-spacing="-1.5">Detection</text>
  <text x="60" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#94a3b8">Separating healthy and Parkinson's voice recordings</text>
  <text x="60" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#94a3b8">with a balanced, ensemble classification pipeline.</text>

  <!-- 2D projection (decorative) with decision boundary -->
  <line x1="640" y1="170" x2="640" y2="520" stroke="#2dd4bf" stroke-opacity="0.15"/>
  <line x1="640" y1="520" x2="1120" y2="520" stroke="#2dd4bf" stroke-opacity="0.15"/>

  <path d="M820 200 C 860 300, 880 360, 900 520" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Healthy cluster -->
  <g fill="#2dd4bf">
    <circle cx="730" cy="270" r="6"/>
    <circle cx="745" cy="290" r="6"/>
    <circle cx="760" cy="260" r="6"/>
    <circle cx="775" cy="285" r="6"/>
    <circle cx="790" cy="305" r="6"/>
    <circle cx="755" cy="320" r="6"/>
    <circle cx="740" cy="335" r="6"/>
    <circle cx="770" cy="240" r="6"/>
    <circle cx="800" cy="270" r="6"/>
    <circle cx="720" cy="300" r="6"/>
    <circle cx="785" cy="330" r="6"/>
    <circle cx="765" cy="350" r="6"/>
    <circle cx="700" cy="250" r="5" fill-opacity="0.5"/>
    <circle cx="850" cy="250" r="5" fill-opacity="0.5"/>
  </g>

  <!-- Parkinson's cluster -->
  <g fill="#fb7185">
    <circle cx="950" cy="380" r="6"/>
    <circle cx="965" cy="395" r="6"/>
    <circle cx="990" cy="375" r="6"/>
    <circle cx="1005" cy="410" r="6"/>
    <circle cx="975" cy="420" r="6"/>
    <circle cx="1000" cy="440" r="6"/>
    <circle cx="960" cy="430" r="6"/>
    <circle cx="1020" cy="395" r="6"/>
    <circle cx="940" cy="410" r="6"/>
    <circle cx="985" cy="455" r="6"/>
    <circle cx="1010" cy="425" r="6"/>
    <circle cx="1030" cy="450" r="6"/>
    <circle cx="1060" cy="340" r="5" fill-opacity="0.5"/>
    <circle cx="880" cy="440" r="5" fill-opacity="0.5"/>
  </g>

  <!-- Voice signal trace (decorative) -->
  <path d="M640 575 Q 656 555 672 575 T 704 575 T 736 575 T 768 575 T 800 575 T 832 575 T 864 575 T 896 575 T 928 575 T 960 575 T 992 575 T 1024 575 T 1056 575 T 1088 575 T 1120 575" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Tech tags -->
  <g font-family="'Geist Mono', Consolas, monospace" font-size="14">
    <rect x="60" y="610" width="80" height="30" rx="15" fill="#06201f" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="100" y="630" text-anchor="middle" fill="#ccfbf1">Python</text>
    <rect x="150" y="610" width="84" height="30" rx="15" fill="#06201f" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="192" y="630" text-anchor="middle" fill="#ccfbf1">Pandas</text>
    <rect x="244" y="610" width="120" height="30" rx="15" fill="#06201f" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="304" y="630" text-anchor="middle" fill="#ccfbf1">Scikit-Learn</text>
    <rect x="374" y="610" width="64" height="30" rx="15" fill="#06201f" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="406" y="630" text-anchor="middle" fill="#ccfbf1">PCA</text>
    <rect x="448" y="610" width="156" height="30" rx="15" fill="#06201f" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="526" y="630" text-anchor="middle" fill="#ccfbf1">VotingClassifier</text>
  </g>
