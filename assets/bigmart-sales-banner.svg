<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f0a"/>
      <stop offset="1" stop-color="#07060a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- Outlet network (decorative): hub at centre, ring of outlets -->
  <circle cx="880" cy="360" r="190" fill="none" stroke="#f59e0b" stroke-opacity="0.18" stroke-dasharray="3 6"/>
  <circle cx="880" cy="360" r="120" fill="none" stroke="#f59e0b" stroke-opacity="0.1"/>

  <g stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="880" y1="360" x2="1070" y2="360"/>
    <line x1="880" y1="360" x2="1034" y2="472"/>
    <line x1="880" y1="360" x2="939" y2="541"/>
    <line x1="880" y1="360" x2="821" y2="541"/>
    <line x1="880" y1="360" x2="726" y2="472"/>
    <line x1="880" y1="360" x2="690" y2="360"/>
    <line x1="880" y1="360" x2="726" y2="248"/>
    <line x1="880" y1="360" x2="821" y2="179"/>
    <line x1="880" y1="360" x2="939" y2="179"/>
    <line x1="880" y1="360" x2="1034" y2="248"/>
  </g>

  <g fill="#140f0a" stroke="#f59e0b" stroke-width="2">
    <circle cx="1070" cy="360" r="10"/>
    <circle cx="1034" cy="472" r="10"/>
    <circle cx="939" cy="541" r="10"/>
    <circle cx="821" cy="541" r="10"/>
    <circle cx="726" cy="472" r="10"/>
    <circle cx="690" cy="360" r="10"/>
    <circle cx="726" cy="248" r="10"/>
    <circle cx="821" cy="179" r="10"/>
    <circle cx="939" cy="179" r="10"/>
    <circle cx="1034" cy="248" r="10"/>
  </g>

  <circle cx="880" cy="360" r="46" fill="#f59e0b" fill-opacity="0.15"/>
  <circle cx="880" cy="360" r="30" fill="url(#hub)" filter="url(#glow)"/>

  <!-- Header -->
  <text x="60" y="110" font-family="'Geist Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#fbbf24">RETAIL ANALYTICS · SALES FORECASTING</text>
  <text x="60" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#fdf8ef" letter-spacing="-1.5">BigMart Sales</text>
  <text x="60" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#fdf8ef" letter-spacing="-1.5">Intelligence</text>
  <text x="60" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#a8a29e">Forecasting item-outlet sales across a retail network,</text>
  <text x="60" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#a8a29e">and turning model output into pricing and stock decisions.</text>

  <!-- Tech tags -->
  <g font-family="'Geist Mono', Consolas, monospace" font-size="14">
    <rect x="60" y="610" width="80" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="100" y="630" text-anchor="middle" fill="#d6d3d1">Python</text>
    <rect x="150" y="610" width="120" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="210" y="630" text-anchor="middle" fill="#d6d3d1">scikit-learn</text>
    <rect x="280" y="610" width="96" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="328" y="630" text-anchor="middle" fill="#d6d3d1">XGBoost</text>
    <rect x="386" y="610" width="110" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="441" y="630" text-anchor="middle" fill="#d6d3d1">LightGBM</text>
    <rect x="506" y="610" width="72" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="542" y="630" text-anchor="middle" fill="#d6d3d1">SHAP</text>
    <rect x="588" y="610" width="100" height="30" rx="15" fill="#1a130b" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="638" y="630" text-anchor="middle" fill="#d6d3d1">Streamlit</text>
  </g>
</svg>
